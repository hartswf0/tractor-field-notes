<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRACTOR FOLKOLOGICUS — Geometric Thinking Medium</title>
    <style>
        /* CORE SYSTEM - SURFACING THE INVISIBLE */
        :root {
            --bg-primary: #f0ede5;
            --bg-secondary: #faf8f3;
            --text-primary: #1a1a1a;
            --highlight: #86efac;
            --warning: #ffab70;
            --danger: #ff6b6b;
            --coda: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.85);
            --grid: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-primary);
            overflow: hidden;
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        /* HEADER - VISUAL CONTROL CENTER */
        header {
            background: var(--bg-secondary);
            border-bottom: 2px solid var(--text-primary);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            min-height: 60px;
        }

        .shape-palette {
            display: flex;
            gap: 10px;
        }

        .shape-tool {
            width: 30px;
            height: 30px;
            border: 2px solid var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            transition: all 0.2s;
        }

        .shape-tool:hover { transform: scale(1.1); }
        .shape-tool.active { background: var(--highlight); }

        .control-panel {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .parameter-knob {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--text-primary);
            background: conic-gradient(from 0deg, var(--highlight) 0deg, white 0deg);
            cursor: pointer;
            position: relative;
        }

        .knob-label {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            white-space: nowrap;
        }

        /* MAIN CANVAS - SPATIAL THINKING GROUND */
        #thinking-canvas {
            width: 100%;
            height: 100%;
            min-height: 500px; /* FORCE MINIMUM HEIGHT */
            min-width: 900px;  /* FORCE MINIMUM WIDTH */
            background-image: 
                radial-gradient(circle at 50px 50px, var(--grid) 1px, transparent 1px),
                radial-gradient(circle at 150px 150px, var(--grid) 1px, transparent 1px);
            background-size: 100px 100px;
            cursor: crosshair;
            display: block; /* ENSURE IT'S A BLOCK ELEMENT */
        }

        /* FOOTER */
        footer {
            background: var(--bg-secondary);
            border-top: 2px solid var(--text-primary);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 50px;
        }

        .debug-info {
            font-size: 9px;
            color: var(--text-secondary);
        }

        .control-button {
            padding: 6px 10px;
            background: var(--highlight);
            border: 1px solid var(--text-primary);
            cursor: pointer;
            font-size: 9px;
            font-weight: bold;
        }
    </style>
<base target="_blank">
</head>
<body>
    <header>
        <div class="shape-palette">
            <div class="shape-tool active" data-shape="circle">○</div>
            <div class="shape-tool" data-shape="trade">↔</div>
            <div class="shape-tool" data-shape="heart">❤</div>
            <div class="shape-tool" data-shape="seed">ᰔ</div>
            <div class="shape-tool" data-shape="choice">⟷</div>
            <div class="shape-tool" data-shape="pattern">⬡</div>
            <div class="shape-tool" data-shape="zero">·</div>
        </div>
        <div class="control-panel">
            <div class="parameter-knob" data-param="boundary" title="Boundary Clarity">
                <div class="knob-label">CLARITY</div>
            </div>
            <div class="parameter-knob" data-param="flow" title="Flow Rate">
                <div class="knob-label">FLOW</div>
            </div>
            <div class="parameter-knob" data-param="balance" title="Balance">
                <div class="knob-label">BALANCE</div>
            </div>
        </div>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; background: #f0ede5;">
        <canvas id="thinking-canvas"></canvas>
    </main>

    <footer>
        <div class="debug-info" id="debugInfo">Canvas: Loading...</div>
        <div>
            <button class="control-button" id="resetBtn">Reset Scene</button>
            <button class="control-button" id="pauseBtn">Pause</button>
        </div>
    </footer>

    <script>
        // DEBUGGING: Immediately check if canvas exists
        console.log('=== FOLKOLOGICUS INITIALIZATION ===');
        const canvas = document.getElementById('thinking-canvas');
        console.log('Canvas element found:', canvas);

        if (!canvas) {
            alert('ERROR: Canvas element not found in DOM');
        }

        // SHAPE RENDERER
        class ShapeRenderer {
            constructor(ctx) {
                this.ctx = ctx;
                this.shapes = new Map();
                this.connections = [];
                this.isRunning = true;
                this.tradeEdges = [];
                console.log('ShapeRenderer initialized with context:', ctx);
            }

            createShape(type, x, y, data) {
                const shape = {
                    id: Date.now() + Math.random(),
                    type,
                    x,
                    y,
                    data,
                    radius: this.getDefaultRadius(type),
                    boundaryWidth: 2,
                    boundaryOpacity: 1,
                    fillOpacity: 0.15,
                    pulsePhase: Math.random() * Math.PI * 2,
                    color: this.getShapeColor(type)
                };
                if (type === 'circle') {
                    shape.heart = { energy: 0.6, capacity: 1.0, pulsePhase: shape.pulsePhase };
                }
                this.shapes.set(shape.id, shape);
                console.log(`Shape created: ${type} at (${x}, ${y})`, shape);
                return shape;
            }

            getDefaultRadius(type) {
                const radii = { circle: 45, heart: 40, seed: 35, trade: 30, choice: 35, pattern: 50, zero: 25 };
                return radii[type] || 35;
            }

            getShapeColor(type) {
                const colors = {
                    circle: '134, 239, 172',
                    trade: '255, 204, 128',
                    heart: '255, 171, 145',
                    seed: '197, 225, 165',
                    choice: '179, 157, 219',
                    pattern: '144, 202, 249',
                    zero: '176, 190, 197'
                };
                return colors[type] || '128, 128, 128';
            }

            render() {
                // Clear canvas
                this.ctx.clearRect(0, 0, this.ctx.canvas.width, this.ctx.canvas.height);
                
                // Render connections
                this.connections.forEach(conn => this.renderConnection(conn));
                
                // Render shapes
                this.shapes.forEach(shape => this.renderShape(shape));

                // Render trade edges (tokens/flows)
                this.tradeEdges.forEach(edge => this.renderTradeEdge(edge));
            }

            renderShape(shape) {
                this.ctx.save();
                
                // Pulse animation for hearts
                if (shape.type === 'heart') {
                    const pulse = Math.sin(Date.now() * 0.002 + shape.pulsePhase) * 0.08 + 1;
                    this.ctx.translate(shape.x, shape.y);
                    this.ctx.scale(pulse, pulse);
                    this.ctx.translate(-shape.x, -shape.y);
                }

                // Set visual properties
                this.ctx.strokeStyle = `rgba(26, 26, 26, ${shape.boundaryOpacity})`;
                this.ctx.lineWidth = shape.boundaryWidth;
                this.ctx.fillStyle = `rgba(${shape.color}, ${shape.fillOpacity})`;

                // Draw shape by type
                switch(shape.type) {
                    case 'circle':
                        this.ctx.beginPath();
                        this.ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.stroke();
                        // Draw inner boundary if large enough
                        if (shape.radius > 30) {
                            this.ctx.beginPath();
                            this.ctx.arc(shape.x, shape.y, shape.radius * 0.6, 0, Math.PI * 2);
                            this.ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                            this.ctx.lineWidth = 1;
                            this.ctx.stroke();
                        }
                        if (shape.heart) {
                            const e = Math.max(0, Math.min(1, shape.heart.energy));
                            const pulse = Math.sin(Date.now() * 0.002 + shape.heart.pulsePhase) * (0.05 + 0.1 * e) + 1;
                            const r = shape.radius * (0.22 + 0.08 * e) * pulse;
                            this.ctx.beginPath();
                            this.ctx.arc(shape.x, shape.y, r, 0, Math.PI * 2);
                            this.ctx.fillStyle = `rgba(255, 171, 145, ${0.3 + 0.4 * e})`;
                            this.ctx.fill();
                            this.ctx.strokeStyle = `rgba(26, 26, 26, ${0.3 + 0.5 * e})`;
                            this.ctx.lineWidth = 1;
                            this.ctx.stroke();
                        }
                        break;

                    case 'heart':
                        // Main circle
                        this.ctx.beginPath();
                        this.ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.stroke();
                        
                        // Radiating lines (life flow)
                        for (let i = 0; i < 6; i++) {
                            const angle = (i / 6) * Math.PI * 2;
                            this.ctx.beginPath();
                            this.ctx.moveTo(shape.x, shape.y);
                            this.ctx.lineTo(
                                shape.x + Math.cos(angle) * shape.radius * 1.3,
                                shape.y + Math.sin(angle) * shape.radius * 1.3
                            );
                            this.ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                            this.ctx.lineWidth = 1;
                            this.ctx.stroke();
                        }
                        break;

                    case 'seed':
                        // Spiral
                        this.ctx.beginPath();
                        for (let i = 0; i < 20; i++) {
                            const angle = i * 0.5;
                            const r = (i / 20) * shape.radius;
                            const x = shape.x + Math.cos(angle) * r;
                            const y = shape.y + Math.sin(angle) * r;
                            if (i === 0) this.ctx.moveTo(x, y);
                            else this.ctx.lineTo(x, y);
                        }
                        this.ctx.stroke();
                        break;

                    case 'trade':
                        // Bidirectional arrow
                        this.drawArrow(shape.x - 20, shape.y, shape.x + 20, shape.y, true);
                        break;

                    case 'choice':
                        // Two opposing arrows
                        this.drawArrow(shape.x - 15, shape.y - 10, shape.x + 15, shape.y - 10, false);
                        this.drawArrow(shape.x + 15, shape.y + 10, shape.x - 15, shape.y + 10, false);
                        break;

                    case 'pattern':
                        // Nested hexagons
                        for (let i = 1; i <= 3; i++) {
                            this.ctx.beginPath();
                            for (let j = 0; j < 6; j++) {
                                const angle = (j / 6) * Math.PI * 2;
                                const x = shape.x + Math.cos(angle) * shape.radius * (i / 3);
                                const y = shape.y + Math.sin(angle) * shape.radius * (i / 3);
                                if (j === 0) this.ctx.moveTo(x, y);
                                else this.ctx.lineTo(x, y);
                            }
                            this.ctx.closePath();
                            this.ctx.stroke();
                        }
                        break;

                    case 'zero':
                        // Center point
                        this.ctx.beginPath();
                        this.ctx.arc(shape.x, shape.y, 3, 0, Math.PI * 2);
                        this.ctx.fill();
                        this.ctx.stroke();
                        
                        // Outer ring
                        this.ctx.beginPath();
                        this.ctx.arc(shape.x, shape.y, shape.radius, 0, Math.PI * 2);
                        this.ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                        this.ctx.lineWidth = 1;
                        this.ctx.stroke();
                        break;
                }

                // Label
                this.ctx.fillStyle = '#1a1a1a';
                this.ctx.font = `10px monospace`;
                this.ctx.textAlign = 'center';
                this.ctx.fillText(shape.data.label, shape.x, shape.y + shape.radius + 15);

                this.ctx.restore();
            }

            drawArrow(x1, y1, x2, y2, bidirectional) {
                const headlen = 8;
                const angle = Math.atan2(y2 - y1, x2 - x1);
                
                // Shaft
                this.ctx.beginPath();
                this.ctx.moveTo(x1, y1);
                this.ctx.lineTo(x2, y2);
                this.ctx.stroke();
                
                // Head
                this.ctx.beginPath();
                this.ctx.moveTo(x2, y2);
                this.ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI/6), y2 - headlen * Math.sin(angle - Math.PI/6));
                this.ctx.moveTo(x2, y2);
                this.ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI/6), y2 - headlen * Math.sin(angle + Math.PI/6));
                this.ctx.stroke();
                
                if (bidirectional) {
                    // Back arrow
                    this.ctx.beginPath();
                    this.ctx.moveTo(x1, y1);
                    this.ctx.lineTo(x1 + headlen * Math.cos(angle - Math.PI/6), y1 + headlen * Math.sin(angle - Math.PI/6));
                    this.ctx.moveTo(x1, y1);
                    this.ctx.lineTo(x1 + headlen * Math.cos(angle + Math.PI/6), y1 + headlen * Math.sin(angle + Math.PI/6));
                    this.ctx.stroke();
                }
            }

            renderConnection(conn) {
                this.ctx.save();
                this.ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
                this.ctx.lineWidth = 1;
                this.ctx.setLineDash([4, 4]);
                
                this.ctx.beginPath();
                this.ctx.moveTo(conn.from.x, conn.from.y);
                this.ctx.lineTo(conn.to.x, conn.to.y);
                this.ctx.stroke();
                this.ctx.restore();
            }

            addTradeEdge(fromCircleId, toCircleId, opts = {}) {
                const from = this.shapes.get(fromCircleId);
                const to = this.shapes.get(toCircleId);
                if (!from || !to || from.type !== 'circle' || to.type !== 'circle') return null;
                const edge = {
                    id: Date.now() + Math.random(),
                    fromId: fromCircleId,
                    toId: toCircleId,
                    flowRate: typeof opts.flowRate === 'number' ? opts.flowRate : 1,
                    particles: []
                };
                const total = 18;
                for (let i = 0; i < total; i++) {
                    edge.particles.push({ t: Math.random(), dir: i % 2 === 0 ? 1 : -1, speed: 0.15 + Math.random() * 0.1 });
                }
                this.tradeEdges.push(edge);
                return edge;
            }

            renderTradeEdge(edge) {
                const from = this.shapes.get(edge.fromId);
                const to = this.shapes.get(edge.toId);
                if (!from || !to) return;
                const ax = from.x, ay = from.y, bx = to.x, by = to.y;

                this.ctx.save();
                this.ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                this.ctx.lineWidth = 1;
                this.ctx.setLineDash([3, 3]);
                this.ctx.beginPath();
                this.ctx.moveTo(ax, ay);
                this.ctx.lineTo(bx, by);
                this.ctx.stroke();
                this.ctx.setLineDash([]);

                for (const p of edge.particles) {
                    const t = Math.max(0, Math.min(1, p.t));
                    const x = ax + (bx - ax) * t;
                    const y = ay + (by - ay) * t;
                    this.ctx.beginPath();
                    this.ctx.arc(x, y, 2, 0, Math.PI * 2);
                    this.ctx.fillStyle = p.dir > 0 ? 'rgba(255, 171, 145, 0.85)' : 'rgba(144, 202, 249, 0.85)';
                    this.ctx.fill();
                }
                this.ctx.restore();
            }

            update(dt, params) {
                for (const edge of this.tradeEdges) {
                    const from = this.shapes.get(edge.fromId);
                    const to = this.shapes.get(edge.toId);
                    if (!from || !to) continue;
                    const flowBase = 0.25 * edge.flowRate * (params.flow ?? 0.6) * dt;
                    const bias = Math.max(0, Math.min(1, params.balance ?? 0.5));
                    const outFT = flowBase * bias;
                    const outTF = flowBase * (1 - bias);
                    if (from.heart && to.heart) {
                        from.heart.energy = Math.max(0, Math.min(1, from.heart.energy - outFT + outTF * 0.8));
                        to.heart.energy = Math.max(0, Math.min(1, to.heart.energy - outTF + outFT * 0.8));
                    }
                    for (const p of edge.particles) {
                        const v = (p.speed) * (params.flow ?? 0.6) * dt * (edge.flowRate);
                        p.t += v * (p.dir > 0 ? 1 : -1);
                        if (p.t > 1) p.t = 0;
                        if (p.t < 0) p.t = 1;
                    }
                }
                for (const shape of this.shapes.values()) {
                    if (shape.type === 'circle' && shape.heart) {
                        shape.heart.energy = Math.max(0, Math.min(1, shape.heart.energy - 0.02 * dt));
                        const e = shape.heart.energy;
                        shape.boundaryOpacity = 0.25 + 0.75 * e * (params.boundary ?? 0.7);
                        shape.fillOpacity = 0.05 + 0.25 * e;
                    }
                }
            }

            connectShapes(fromId, toId) {
                const from = this.shapes.get(fromId);
                const to = this.shapes.get(toId);
                if (from && to) {
                    this.connections.push({ from, to });
                }
            }

            getShapeAt(x, y) {
                for (const shape of this.shapes.values()) {
                    const dx = x - shape.x;
                    const dy = y - shape.y;
                    if (Math.sqrt(dx * dx + dy * dy) < shape.radius) {
                        return shape;
                    }
                }
                return null;
            }

            clear() {
                this.shapes.clear();
                this.connections = [];
            }
        }

        // MAIN APPLICATION
        class GeometricThinkingApp {
            constructor() {
                console.log('GeometricThinkingApp initializing...');
                this.canvas = document.getElementById('thinking-canvas');
                
                // EMERGENCY CHECK: If canvas doesn't exist, create it
                if (!this.canvas) {
                    console.error('CANVAS NOT FOUND IN DOM!');
                    const emergencyCanvas = document.createElement('canvas');
                    emergencyCanvas.id = 'thinking-canvas';
                    emergencyCanvas.style.width = '100%';
                    emergencyCanvas.style.height = '100%';
                    emergencyCanvas.style.background = 'white';
                    document.querySelector('main').appendChild(emergencyCanvas);
                    this.canvas = emergencyCanvas;
                }
                
                this.ctx = this.canvas.getContext('2d');
                console.log('Canvas context:', this.ctx);
                
                this.renderer = new ShapeRenderer(this.ctx);
                this.state = { selectedShape: null, isDragging: false, dragOffset: { x: 0, y: 0 }, tradeFromCircleId: null };
                this.params = { boundary: 0.7, flow: 0.6, balance: 0.5 };
                this._lastTs = performance.now();
                this.setupCanvas();
                this.setupEventListeners();
                this.initializeDefaultShapes();
                this.animate();
                
                console.log('Application fully initialized');
                document.getElementById('debugInfo').textContent = 'Canvas: Ready • Shapes: ' + this.renderer.shapes.size;
            }

            setupCanvas() {
                // Ensure canvas is visible and sized
                const rect = this.canvas.getBoundingClientRect();
                const cssWidth = rect.width;
                const cssHeight = rect.height;
                
                // Set canvas internal size for high-DPI displays
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = cssWidth * dpr;
                this.canvas.height = cssHeight * dpr;
                
                // Scale context so CSS pixels match
                this.ctx.scale(dpr, dpr);
                
                console.log(`Canvas sized: ${cssWidth}x${cssHeight}px (internal: ${this.canvas.width}x${this.canvas.height})`);
            }

            setupEventListeners() {
                // Shape tools
                document.querySelectorAll('.shape-tool').forEach(tool => {
                    tool.addEventListener('click', () => {
                        document.querySelectorAll('.shape-tool').forEach(t => t.classList.remove('active'));
                        tool.classList.add('active');
                        console.log('Selected tool:', tool.dataset.shape);
                    });
                });

                // Canvas interactions
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.canvas.addEventListener('mouseup', () => this.handleMouseUp());
                
                // Prevent context menu
                this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());

                // Control buttons
                document.getElementById('resetBtn').addEventListener('click', () => this.resetScene());
                document.getElementById('pauseBtn').addEventListener('click', () => this.toggleAnimation());

                document.querySelectorAll('.parameter-knob').forEach(knob => {
                    knob.addEventListener('click', () => {
                        const k = knob.getAttribute('data-param');
                        if (!k) return;
                        this.params[k] = ((this.params[k] ?? 0) + 0.1) % 1.0;
                        const deg = Math.round((this.params[k]) * 360);
                        knob.style.background = `conic-gradient(from 0deg, var(--highlight) ${deg}deg, white ${deg}deg)`;
                    });
                });
            }

            initializeDefaultShapes() {
                console.log('Creating default shapes...');
                
                const c1 = this.renderer.createShape('circle', 240, 220, { label: 'CIRCLE A', axiom: 'circle' });
                const c2 = this.renderer.createShape('circle', 520, 320, { label: 'CIRCLE B', axiom: 'circle' });
                this.renderer.addTradeEdge(c1.id, c2.id, { flowRate: 1 });
            }

            findShapeByAxiom(axiom) {
                return Array.from(this.renderer.shapes.values()).find(s => s.data.axiom === axiom);
            }

            getCircleAt(x, y) {
                const s = this.renderer.getShapeAt(x, y);
                return s && s.type === 'circle' ? s : null;
            }

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const activeTool = document.querySelector('.shape-tool.active')?.dataset.shape;

                if (activeTool === 'trade') {
                    const circle = this.getCircleAt(x, y);
                    if (circle) {
                        if (!this.state.tradeFromCircleId) {
                            this.state.tradeFromCircleId = circle.id;
                        } else if (this.state.tradeFromCircleId !== circle.id) {
                            this.renderer.addTradeEdge(this.state.tradeFromCircleId, circle.id, { flowRate: 1 });
                            this.state.tradeFromCircleId = null;
                        } else {
                            this.state.tradeFromCircleId = null;
                        }
                    }
                    return;
                }

                let clickedShape = this.renderer.getShapeAt(x, y);
                
                if (clickedShape) {
                    console.log('Clicked shape:', clickedShape.data.label);
                } else if (activeTool) {
                    console.log('Creating new shape:', activeTool, 'at', x, y);
                    const shape = this.renderer.createShape(activeTool, x, y, { 
                        label: activeTool.toUpperCase(), 
                        axiom: activeTool 
                    });
                    clickedShape = shape;
                }

                this.state.selectedShape = clickedShape;
                this.state.isDragging = true;
                this.state.dragOffset = clickedShape ? 
                    { x: x - clickedShape.x, y: y - clickedShape.y } : 
                    { x: 0, y: 0 };
            }

            handleMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (this.state.isDragging && this.state.selectedShape) {
                    this.state.selectedShape.x = x - this.state.dragOffset.x;
                    this.state.selectedShape.y = y - this.state.dragOffset.y;
                }

                const hovered = this.renderer.getShapeAt(x, y);
                this.canvas.style.cursor = hovered ? 'move' : 'crosshair';
            }

            handleMouseUp() {
                this.state.isDragging = false;
            }

            resetScene() {
                console.log('Resetting scene...');
                this.renderer.clear();
                this.renderer.tradeEdges = [];
                this.state.tradeFromCircleId = null;
                this.initializeDefaultShapes();
            }

            toggleAnimation() {
                this.renderer.isRunning = !this.renderer.isRunning;
                const btn = document.getElementById('pauseBtn');
                btn.textContent = this.renderer.isRunning ? 'Pause' : 'Resume';
                if (this.renderer.isRunning) this.animate();
            }

            animate() {
                const now = performance.now();
                const dt = Math.max(0.001, Math.min(0.05, (now - this._lastTs) / 1000));
                this._lastTs = now;
                this.renderer.update(dt, this.params);
                this.renderer.render();
                document.getElementById('debugInfo').textContent = `Canvas: Ready • Circles: ${Array.from(this.renderer.shapes.values()).filter(s=>s.type==='circle').length} • Trades: ${this.renderer.tradeEdges.length}`;
                if (this.renderer.isRunning) {
                    requestAnimationFrame(() => this.animate());
                }
            }
        }

        // EMERGENCY FALLBACK: If DOM isn't ready, wait
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                console.log('DOM ready, initializing app...');
                new GeometricThinkingApp();
            });
        } else {
            console.log('DOM already ready, initializing immediately...');
            new GeometricThinkingApp();
        }
    </script>
</body>
</html>
