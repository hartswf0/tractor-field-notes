<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethics Infrastructure</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23FFD700'/%3E%3Crect x='6' y='6' width='8' height='8' rx='2' fill='%23000'/%3E%3Crect x='18' y='6' width='8' height='8' rx='2' fill='%23000'/%3E%3Crect x='6' y='18' width='8' height='8' rx='2' fill='%23000'/%3E%3Crect x='18' y='18' width='8' height='8' rx='2' fill='%23000'/%3E%3C/svg%3E">
    <style>
        :root {
            --primary: #FFD700;
            --primary-glow: rgba(255, 215, 0, 0.4);
            --secondary: #4ECDC4;
            --tertiary: #9D4EDD;
            --border: 3px solid #333;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #ddd;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header-brick {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: var(--border);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .header-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
            letter-spacing: 2px;
        }

        .tabs-brick {
            display: flex;
            gap: 4px;
            background: #333;
            padding: 2px;
            border-radius: 6px;
        }

        .tab {
            padding: 8px 16px;
            background: #1a1a1a;
            border: 2px solid transparent;
            color: #888;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .tab:hover {
            color: #ddd;
            border-color: #555;
        }

        .tab.on {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .view-container {
            flex: 1;
            padding: 24px;
            overflow: auto;
        }

        .view {
            display: none;
            max-width: 1600px;
            margin: 0 auto;
        }

        .view.on {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .project-brick {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 4px solid #333;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .project-header {
            background: #1a1a1a;
            padding: 16px 20px;
            border-bottom: 3px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .project-name {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 2px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #555;
        }

        .status-dot.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .project-frame {
            flex: 1;
            position: relative;
            background: #000;
        }

        .project-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #555;
            gap: 12px;
        }

        .empty-icon {
            font-size: 48px;
            opacity: 0.3;
        }

        .empty-text {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .legend-brick {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #333;
            border-radius: 12px;
            padding: 16px 24px;
            display: flex;
            gap: 32px;
            box-shadow: var(--shadow);
            z-index: 100;
        }

        .legend-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .legend-key {
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .legend-item:nth-child(1) .legend-key {
            background: rgba(255, 215, 0, 0.2);
            color: var(--primary);
        }

        .legend-item:nth-child(2) .legend-key {
            background: rgba(78, 205, 196, 0.2);
            color: var(--secondary);
        }

        .legend-item:nth-child(3) .legend-key {
            background: rgba(157, 78, 221, 0.2);
            color: var(--tertiary);
        }

        .legend-desc {
            font-size: 9px;
            color: #888;
        }

        .focus-btn {
            background: transparent;
            border: 1px solid #555;
            border-radius: 4px;
            color: #888;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
        }

        .focus-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .focus-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.on {
            display: flex;
        }

        .modal-brick {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 4px solid #333;
            border-radius: 16px;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .modal-header {
            background: #1a1a1a;
            padding: 16px 20px;
            border-bottom: 3px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px 12px 0 0;
        }

        .modal-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 2px;
        }

        .modal-controls {
            display: flex;
            gap: 8px;
        }

        .modal-btn {
            background: #0a0a0a;
            border: 2px solid #555;
            border-radius: 6px;
            color: #888;
            padding: 6px 12px;
            font-family: inherit;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .modal-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .modal-btn.expand {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .modal-btn.expand:hover {
            background: var(--secondary);
            color: #000;
        }

        .modal-btn.close {
            border-color: #ff4444;
            color: #ff4444;
        }

        .modal-btn.close:hover {
            background: #ff4444;
            color: #000;
        }

        .modal-frame {
            flex: 1;
            position: relative;
            background: #000;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
        }

        .modal-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        @media (max-width: 1200px) {
            .view.on {
                grid-template-columns: 1fr;
            }

            .project-brick {
                min-height: 400px;
            }
        }

        @media (max-width: 768px) {
            .header-brick {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
            }

            .header-title {
                font-size: 18px;
            }

            .tabs-brick {
                width: 100%;
                justify-content: center;
            }

            .tab {
                flex: 1;
                padding: 8px 12px;
                font-size: 10px;
            }

            .view-container {
                padding: 16px;
            }

            .project-brick {
                min-height: 350px;
            }

            .legend-brick {
                flex-direction: column;
                gap: 12px;
                padding: 12px 16px;
                bottom: 16px;
            }

            .legend-item {
                flex-direction: row;
                gap: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="header-brick">
        <div class="header-title">🧱 ETHICS INFRASTRUCTURE</div>
        <div class="tabs-brick">
            <button class="tab on" onclick="setTab('map')">MAPS</button>
            <button class="tab" onclick="setTab('glossary')">GLOSSARIES</button>
            <button class="tab" onclick="setTab('genome')">GENOMES</button>
        </div>
    </div>

    <div class="view-container">
        <div id="mapView" class="view on"></div>
        <div id="glossaryView" class="view"></div>
        <div id="genomeView" class="view"></div>
    </div>

    <div class="legend-brick">
        <div class="legend-item">
            <div class="legend-key">MAP</div>
            <div class="legend-desc">Navigation</div>
        </div>
        <div class="legend-item">
            <div class="legend-key">GLOSSARY</div>
            <div class="legend-desc">Definitions</div>
        </div>
        <div class="legend-item">
            <div class="legend-key">GENOME</div>
            <div class="legend-desc">Structure</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-brick">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-controls">
                    <button class="modal-btn expand" onclick="expandToTab()">↗ NEW TAB</button>
                    <button class="modal-btn close" onclick="closeFocus()">✕ CLOSE</button>
                </div>
            </div>
            <div class="modal-frame">
                <iframe id="modalFrame" src=""></iframe>
            </div>
        </div>
    </div>

    <script>
        const data = [
            {
                name: 'ATG 3.0',
                map: 'https://hartswf0.github.io/atg-3/courage-trail-olog.html',
                glossary: 'https://hartswf0.github.io/atg-3/pattern-glossary.html',
                genome: 'https://hartswf0.github.io/atg-3/project-genome.html'
            },
            {
                name: 'ROLE DECK',
                map: 'https://hartswf0.github.io/role-deck/courage-trail-olog.html',
                glossary: 'https://hartswf0.github.io/role-deck/pattern-glossary.html',
                genome: 'https://hartswf0.github.io/role-deck/role-deck-genome.html'
            },
            {
                name: 'TRACTOR',
                map: 'https://hartswf0.github.io/tractor-dce-gyo/sitemap-manifold-04.html',
                glossary: 'https://hartswf0.github.io/tractor-dce-gyo/pattern-glossary.html',
                genome: 'https://hartswf0.github.io/tractor-dce-gyo/project-genome-dce-gyo.html'
            },
            {
                name: 'CORE-AGE',
                map: 'https://hartswf0.github.io/core-age/courage-trail-olog.html',
                glossary: 'https://hartswf0.github.io/core-age/pattern-glossary.html',
                genome: 'https://hartswf0.github.io/core-age/courage-genome.html'
            }
        ];

        function init() {
            ['map', 'glossary', 'genome'].forEach(type => {
                const view = document.getElementById(`${type}View`);

                data.forEach(d => {
                    const brick = document.createElement('div');
                    brick.className = 'project-brick';

                    const header = document.createElement('div');
                    header.className = 'project-header';

                    const name = document.createElement('div');
                    name.className = 'project-name';
                    name.textContent = d.name;
                    header.appendChild(name);

                    if (d[type]) {
                        const focusBtn = document.createElement('button');
                        focusBtn.className = 'focus-btn';
                        focusBtn.onclick = () => openFocus(d.name, type, d[type]);
                        focusBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zm-4 18v-2H6.41l9.83-9.83-1.41-1.41L5 17.59V14H3v7h7z"/></svg>`;
                        header.appendChild(focusBtn);
                    }

                    const dot = document.createElement('div');
                    dot.className = 'status-dot';
                    if (d[type]) dot.classList.add('active');
                    header.appendChild(dot);

                    brick.appendChild(header);

                    const frame = document.createElement('div');
                    frame.className = 'project-frame';

                    if (d[type]) {
                        frame.innerHTML = `<iframe src="${d[type]}"></iframe>`;
                    } else {
                        frame.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">🧱</div>
                                <div class="empty-text">PENDING</div>
                            </div>
                        `;
                    }

                    brick.appendChild(frame);
                    view.appendChild(brick);
                });
            });
        }

        function setTab(type) {
            document.querySelectorAll('.view').forEach(v => {
                v.classList.remove('on');
            });
            document.getElementById(`${type}View`).classList.add('on');

            document.querySelectorAll('.tab').forEach((t, i) => {
                const types = ['map', 'glossary', 'genome'];
                t.classList.toggle('on', types[i] === type);
            });
        }

        init();

        let currentFocusUrl = '';

        function openFocus(projectName, type, url) {
            const typeName = type === 'genome' ? 'GENOME' : type.toUpperCase();
            document.getElementById('modalTitle').textContent = `${projectName} - ${typeName}`;
            document.getElementById('modalFrame').src = url;
            document.getElementById('modalOverlay').classList.add('on');
            currentFocusUrl = url;
        }

        function closeFocus() {
            document.getElementById('modalOverlay').classList.remove('on');
            document.getElementById('modalFrame').src = '';
            currentFocusUrl = '';
        }

        function expandToTab() {
            if (currentFocusUrl) {
                window.open(currentFocusUrl, '_blank');
            }
        }

        // Close modal on overlay click
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') {
                closeFocus();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('modalOverlay').classList.contains('on')) {
                closeFocus();
                return;
            }

            // Keyboard navigation
            const types = ['map', 'glossary', 'genome'];
            const current = types.findIndex(t => document.getElementById(`${t}View`).classList.contains('on'));

            if (e.key === 'ArrowRight') {
                setTab(types[(current + 1) % 3]);
            } else if (e.key === 'ArrowLeft') {
                setTab(types[(current - 1 + 3) % 3]);
            }
        });
    </script>
</body>

</html>
