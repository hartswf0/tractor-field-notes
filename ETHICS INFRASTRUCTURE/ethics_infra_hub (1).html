<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethics Infrastructure</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23FFD700'/%3E%3Crect x='6' y='6' width='8' height='8' rx='2' fill='%23000'/%3E%3Crect x='18' y='6' width='8' height='8' rx='2' fill='%23000'/%3E%3Crect x='6' y='18' width='8' height='8' rx='2' fill='%23000'/%3E%3Crect x='18' y='18' width='8' height='8' rx='2' fill='%23000'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #faf8f3;
            color: #2a2a2a;
            line-height: 1.3;
            overflow-x: hidden;
        }

        .header {
            padding: 12px 16px;
            background: #2a2a2a;
            color: #faf8f3;
            border-bottom: 3px double #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .nav {
            display: flex;
            gap: 4px;
        }

        .nav-btn {
            padding: 4px 12px;
            background: transparent;
            border: 1px solid #faf8f3;
            color: #faf8f3;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: #faf8f3;
            color: #2a2a2a;
        }

        .nav-btn.active {
            background: #faf8f3;
            color: #2a2a2a;
        }

        .project-grid {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: #2a2a2a;
        }

        .project-row {
            display: grid;
            grid-template-columns: 140px 1fr 1fr 1fr;
            background: #faf8f3;
            border-bottom: 1px solid #2a2a2a;
            min-height: 400px;
        }

        .project-label {
            background: #2a2a2a;
            color: #faf8f3;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            border-right: 1px solid #2a2a2a;
        }

        .iframe-cell {
            position: relative;
            border-right: 1px solid #d0d0d0;
            background: white;
        }

        .iframe-cell:last-child {
            border-right: none;
        }

        .cell-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: #2a2a2a;
            color: #faf8f3;
            padding: 6px 10px;
            font-size: 10px;
            letter-spacing: 1px;
            text-align: center;
            z-index: 10;
        }

        .iframe-wrapper {
            position: absolute;
            top: 28px;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .no-content {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .legend {
            background: #2a2a2a;
            color: #faf8f3;
            padding: 16px;
            margin-top: 1px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            font-size: 11px;
        }

        .legend-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .legend-key {
            font-weight: bold;
            letter-spacing: 1px;
        }

        @media (max-width: 1024px) {
            .project-row {
                grid-template-columns: 100px 1fr;
                min-height: 300px;
            }

            .iframe-cell {
                display: none;
            }

            .iframe-cell.mobile-active {
                display: block;
                grid-column: 2;
            }

            .legend {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                gap: 8px;
                padding: 12px;
            }

            .project-row {
                grid-template-columns: 80px 1fr;
                min-height: 250px;
            }

            .project-label {
                font-size: 12px;
                letter-spacing: 2px;
                padding: 12px;
            }

            .cell-header {
                font-size: 9px;
                padding: 5px 8px;
            }

            .iframe-wrapper {
                top: 24px;
            }

            .nav-btn {
                font-size: 10px;
                padding: 4px 10px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="title">ETHICS INFRASTRUCTURE</div>
        <div class="nav" id="mobileNav" style="display: none;">
            <button class="nav-btn active" onclick="switchMobileView('map')">MAP</button>
            <button class="nav-btn" onclick="switchMobileView('glossary')">GLOSS</button>
            <button class="nav-btn" onclick="switchMobileView('genome')">GENOME</button>
        </div>
    </div>

    <div class="project-grid" id="projectGrid"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-key">MAP</div>
            <div>Visual navigation and relationships</div>
        </div>
        <div class="legend-item">
            <div class="legend-key">GLOSSARY</div>
            <div>Terminology and definitions</div>
        </div>
        <div class="legend-item">
            <div class="legend-key">DOC/GENOME</div>
            <div>Core documentation and structure</div>
        </div>
    </div>

    <script>
        const projects = [
            {
                name: 'ATG 3.0',
                resources: {
                    map: 'https://hartswf0.github.io/atg-3/courage-trail-olog.html',
                    glossary: 'https://hartswf0.github.io/atg-3/pattern-glossary.html',
                    genome: 'https://hartswf0.github.io/atg-3/project-genome.html'
                }
            },
            {
                name: 'ROLE DECK',
                resources: {
                    map: 'https://hartswf0.github.io/role-deck/courage-trail-olog.html',
                    glossary: 'https://hartswf0.github.io/role-deck/pattern-glossary.html',
                    genome: 'https://hartswf0.github.io/role-deck/role-deck-genome.html'
                }
            },
            {
                name: 'TRACTOR DCE-GYO',
                resources: {
                    map: 'https://hartswf0.github.io/tractor-dce-gyo/sitemap-manifold-04.html',
                    glossary: 'https://hartswf0.github.io/tractor-dce-gyo/pattern-glossary.html',
                    genome: 'https://hartswf0.github.io/tractor-dce-gyo/project-genome-dce-gyo.html'
                }
            },
            {
                name: 'CORE-AGE',
                resources: {
                    map: 'https://hartswf0.github.io/core-age/courage-trail-olog.html',
                    glossary: 'https://hartswf0.github.io/core-age/pattern-glossary.html',
                    genome: 'https://hartswf0.github.io/core-age/courage-genome.html'
                }
            }
        ];

        let mobileView = 'map';

        function renderGrid() {
            const grid = document.getElementById('projectGrid');

            projects.forEach(project => {
                const row = document.createElement('div');
                row.className = 'project-row';

                const label = document.createElement('div');
                label.className = 'project-label';
                label.textContent = project.name;
                row.appendChild(label);

                ['map', 'glossary', 'genome'].forEach((type, index) => {
                    const cell = document.createElement('div');
                    cell.className = 'iframe-cell';
                    cell.dataset.type = type;

                    if (index === 0) {
                        cell.classList.add('mobile-active');
                    }

                    const header = document.createElement('div');
                    header.className = 'cell-header';
                    header.textContent = type === 'genome' ? 'DOC/GENOME' : type.toUpperCase();
                    cell.appendChild(header);

                    const wrapper = document.createElement('div');
                    wrapper.className = 'iframe-wrapper';

                    if (project.resources[type]) {
                        wrapper.innerHTML = `<iframe src="${project.resources[type]}"></iframe>`;
                    } else {
                        wrapper.innerHTML = '<div class="no-content">PENDING</div>';
                    }

                    cell.appendChild(wrapper);
                    row.appendChild(cell);
                });

                grid.appendChild(row);
            });
        }

        function switchMobileView(type) {
            mobileView = type;

            const cells = document.querySelectorAll('.iframe-cell');
            cells.forEach(cell => {
                cell.classList.toggle('mobile-active', cell.dataset.type === type);
            });

            const btns = document.querySelectorAll('.nav-btn');
            const types = ['map', 'glossary', 'genome'];
            btns.forEach((btn, i) => {
                btn.classList.toggle('active', types[i] === type);
            });
        }

        function checkMobile() {
            const nav = document.getElementById('mobileNav');
            if (window.innerWidth <= 1024) {
                nav.style.display = 'flex';
            } else {
                nav.style.display = 'none';
            }
        }

        renderGrid();
        checkMobile();
        window.addEventListener('resize', checkMobile);
    </script>
</body>

</html>
