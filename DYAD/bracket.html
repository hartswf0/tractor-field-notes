<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5">
    <title>ONYX Two-Sided Bracket</title>
    <meta name="description" content="Philosophical tournament bracket — two sides converge to champion">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #06060a;
            --card: #0f0f16;
            --card-hover: #1a1a24;
            --border: rgba(255, 255, 255, 0.08);
            --gold: #d4af37;
            --gold-dim: rgba(212, 175, 55, 0.2);
            --purple: #8b5cf6;
            --cyan: #06b6d4;
            --green: #10b981;
            --red: #ef4444;
            --text: #f0f0f5;
            --dim: #888;
            --muted: #555;
            --line: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow: auto;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: linear-gradient(180deg, var(--bg), rgba(6, 6, 10, 0.95));
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--gold), var(--purple));
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .logo h1 {
            font-size: 0.9rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--gold), var(--text));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
        }

        .nav-link {
            padding: 0.4rem 0.75rem;
            font-size: 0.7rem;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--dim);
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.15s;
        }

        .nav-link:hover {
            background: var(--card-hover);
            color: var(--text);
        }

        .nav-link.active {
            background: var(--gold);
            color: var(--bg);
            border-color: var(--gold);
        }

        /* Bracket Container */
        .bracket-container {
            padding: 1.5rem;
            overflow: auto;
            min-height: calc(100vh - 50px);
        }

        .bracket {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            min-width: max-content;
        }

        /* Left bracket flows right → center */
        /* Right bracket flows left → center */
        .bracket-half {
            display: flex;
            align-items: center;
        }

        .bracket-half.left {
            flex-direction: row;
        }

        .bracket-half.right {
            flex-direction: row-reverse;
        }

        /* Round column */
        .round {
            display: flex;
            flex-direction: column;
            padding: 0 0.25rem;
            position: relative;
        }

        .round-label {
            text-align: center;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 0.5rem;
            position: sticky;
            top: 0;
        }

        /* Matchup container */
        .matchups {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Single matchup */
        .matchup {
            width: 130px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .matchup:hover {
            background: var(--card-hover);
            border-color: var(--purple);
            transform: scale(1.02);
            z-index: 10;
        }

        .matchup.pending {
            opacity: 0.6;
            border-style: dashed;
        }

        .seed {
            display: flex;
            align-items: center;
            padding: 0.25rem 0.4rem;
            gap: 0.3rem;
            font-size: 0.6rem;
            border-bottom: 1px solid var(--border);
        }

        .seed:last-child {
            border-bottom: none;
        }

        .seed.winner {
            background: var(--gold-dim);
        }

        .seed.winner .seed-name {
            color: var(--gold);
            font-weight: 600;
        }

        .seed-rank {
            width: 14px;
            height: 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            color: var(--muted);
            font-weight: 600;
            flex-shrink: 0;
        }

        .seed.winner .seed-rank {
            background: var(--gold);
            color: var(--bg);
        }

        .seed-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .seed-score {
            font-weight: 600;
            font-size: 0.55rem;
            color: var(--dim);
        }

        .seed-score.high {
            color: var(--green);
        }

        /* Theme badge */
        .theme-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            font-size: 0.45rem;
            padding: 1px 3px;
            background: var(--purple);
            color: white;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            white-space: nowrap;
            max-width: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Connectors */
        .connector {
            width: 20px;
            position: relative;
            flex-shrink: 0;
        }

        /* Champion Center */
        .champion-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 2rem;
        }

        .finals-slot {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
            min-width: 140px;
        }

        .finals-label {
            font-size: 0.5rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 0.25rem;
        }

        .finals-name {
            font-size: 0.75rem;
            font-weight: 600;
        }

        .champion-card {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(139, 92, 246, 0.08));
            border: 2px solid var(--gold);
            border-radius: 10px;
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .champion-crown {
            font-size: 2.5rem;
        }

        .champion-title {
            font-size: 0.6rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin: 0.5rem 0 0.25rem;
        }

        .champion-name {
            font-size: 1rem;
            font-weight: 700;
        }

        .champion-pending {
            font-size: 0.8rem;
            color: var(--muted);
            font-style: italic;
        }

        /* SVG Lines Overlay */
        .lines-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .bracket-line {
            stroke: var(--line);
            stroke-width: 1;
            fill: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .matchup {
                width: 110px;
            }

            .seed {
                font-size: 0.55rem;
                padding: 0.2rem 0.3rem;
            }

            .seed-rank {
                width: 12px;
                height: 12px;
                font-size: 0.45rem;
            }

            .logo h1 {
                display: none;
            }

            .champion-card {
                padding: 1rem;
            }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #101018;
            border: 1px solid var(--border);
            border-radius: 10px;
            max-width: 420px;
            width: 100%;
            overflow: hidden;
        }

        .modal-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--gold);
        }

        .modal-subtitle {
            font-size: 0.65rem;
            color: var(--dim);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--dim);
            font-size: 1.25rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 1rem;
        }

        .modal-matchup {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .modal-entity {
            background: var(--card);
            border-radius: 6px;
            padding: 0.6rem;
            text-align: center;
        }

        .modal-entity.winner {
            background: var(--gold-dim);
            border: 1px solid var(--gold);
        }

        .modal-entity-name {
            font-weight: 600;
            font-size: 0.75rem;
        }

        .modal-entity-theme {
            font-size: 0.55rem;
            color: var(--cyan);
            margin-top: 0.15rem;
        }

        .modal-entity-score {
            font-size: 1.25rem;
            font-weight: 800;
            margin-top: 0.3rem;
        }

        .clash-label {
            text-align: center;
            font-size: 0.6rem;
            color: var(--purple);
            margin-bottom: 0.75rem;
            padding: 0.3rem;
            background: rgba(139, 92, 246, 0.1);
            border-radius: 4px;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 0.6rem;
            background: linear-gradient(90deg, var(--gold), var(--purple));
            color: var(--bg);
            font-weight: 600;
            font-size: 0.75rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.75rem;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <div class="logo-icon">⚔</div>
            <h1>ONYX Tournament</h1>
        </div>
        <div class="nav-links">
            <a href="tournament.html" class="nav-link">Simple</a>
            <a href="bracket.html" class="nav-link active">Two-Sided</a>
            <a href="mapping.html" class="nav-link">Mapping</a>
        </div>
    </header>

    <div class="bracket-container">
        <div class="bracket" id="bracket"></div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="modal-title">Matchup</div>
                    <div class="modal-subtitle" id="modal-subtitle"></div>
                </div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script>
        let bracket = null;
        let ontology = null;
        let authorLookup = {};

        async function init() {
            try {
                const [bracketRes, ontologyRes] = await Promise.all([
                    fetch('./bracket-two-sided.json'),
                    fetch('./ontology.json').catch(() => null)
                ]);
                bracket = await bracketRes.json();

                // Build author lookup from ontology
                if (ontologyRes) {
                    ontology = await ontologyRes.json();
                    ontology.chapters.forEach(ch => {
                        if (ch.winner?.archetype && ch.realAuthor) {
                            authorLookup[ch.winner.archetype.toUpperCase()] = ch.realAuthor;
                        }
                    });
                }

                renderBracket();
            } catch (err) {
                document.getElementById('bracket').innerHTML = `<p style="color:red">Error: ${err.message}<br>Run: node analyze-themes.js</p>`;
            }
        }

        function getAuthor(name) {
            if (!name) return '';
            const author = authorLookup[name.toUpperCase()];
            return author || '';
        }

        function renderBracket() {
            const container = document.getElementById('bracket');

            // Build left half (flowing right → center)
            const leftHtml = renderHalf(bracket.left, 'left');

            // Build right half (flowing left → center, reversed)
            const rightHtml = renderHalf(bracket.right, 'right');

            // Champion center
            const championHtml = `
        <div class="champion-center">
          <div class="finals-slot">
            <div class="finals-label">Left Champion</div>
            <div class="finals-name">${bracket.finals.leftChampion || '???'}</div>
          </div>
          <div class="champion-card">
            <div class="champion-crown">👑</div>
            <div class="champion-title">Champion</div>
            ${bracket.finals.champion
                    ? `<div class="champion-name">${bracket.finals.champion}</div>`
                    : `<div class="champion-pending">To Be Determined</div>`
                }
          </div>
          <div class="finals-slot" style="margin-top: 1rem;">
            <div class="finals-label">Right Champion</div>
            <div class="finals-name">${bracket.finals.rightChampion || '???'}</div>
          </div>
        </div>
      `;

            container.innerHTML = `
        <div class="bracket-half left">${leftHtml}</div>
        ${championHtml}
        <div class="bracket-half right">${rightHtml}</div>
      `;
        }

        function renderHalf(half, side) {
            let html = '';
            const rounds = half.rounds;

            // For left side: rounds go in order (R1 → R2 → ...)
            // For right side: rounds go in order too, but CSS reverses direction

            rounds.forEach((round, rIdx) => {
                // Calculate vertical spacing multiplier
                const spacingFactor = Math.pow(2, rIdx);
                const gap = 4 + (spacingFactor - 1) * 20;

                html += `<div class="round">`;
                html += `<div class="round-label">${round.name}</div>`;
                html += `<div class="matchups" style="gap: ${gap}px;">`;

                round.matchups.forEach((m, mIdx) => {
                    const a = m.entityA || {};
                    const b = m.entityB || {};
                    const aScore = a.score ?? a.avgScore ?? '';
                    const bScore = b?.score ?? b?.avgScore ?? '';
                    const winner = m.winner;
                    const theme = m.theme || a.theme || '';
                    const aAuthor = getAuthor(a.name);
                    const bAuthor = getAuthor(b?.name);

                    html += `
            <div class="matchup ${!winner ? 'pending' : ''}" onclick="openMatchup('${side}', ${round.round}, '${m.id}')">
              ${theme ? `<div class="theme-badge">${theme.substring(0, 8)}</div>` : ''}
              <div class="seed ${winner === a.name ? 'winner' : ''}">
                <span class="seed-rank">${mIdx * 2 + 1}</span>
                <span class="seed-name" title="${aAuthor}">${a.name || '—'}${aAuthor ? ` <small style="color:var(--dim);font-size:0.5rem;">(${aAuthor.split(' ').pop()})</small>` : ''}</span>
                <span class="seed-score ${aScore >= 90 ? 'high' : ''}">${aScore}</span>
              </div>
              <div class="seed ${winner === b?.name ? 'winner' : ''}">
                <span class="seed-rank">${mIdx * 2 + 2}</span>
                <span class="seed-name" title="${bAuthor}">${b?.name || 'BYE'}${bAuthor ? ` <small style="color:var(--dim);font-size:0.5rem;">(${bAuthor.split(' ').pop()})</small>` : ''}</span>
                <span class="seed-score ${bScore >= 90 ? 'high' : ''}">${bScore || ''}</span>
              </div>
            </div>
          `;
                });

                html += `</div></div>`;

                // Add connector
                if (rIdx < rounds.length - 1) {
                    html += `<div class="connector"></div>`;
                }
            });

            return html;
        }

        function openMatchup(side, roundNum, matchupId) {
            const half = side === 'left' ? bracket.left : bracket.right;
            const round = half.rounds.find(r => r.round === roundNum);
            const m = round?.matchups.find(x => x.id === matchupId);
            if (!m) return;

            const a = m.entityA || {};
            const b = m.entityB || {};
            const aAuthor = getAuthor(a.name);
            const bAuthor = getAuthor(b?.name);

            document.getElementById('modal-title').textContent = `${a.name} vs ${b?.name || 'BYE'}`;
            document.getElementById('modal-subtitle').textContent = `${half.name} — ${round.name}`;

            const clash = m.thematicClash || `${a.theme || '?'} vs ${b?.theme || '?'}`;

            document.getElementById('modal-body').innerHTML = `
        <div class="clash-label">⚔️ ${clash}</div>
        <div class="modal-matchup">
          <div class="modal-entity ${m.winner === a.name ? 'winner' : ''}">
            <div class="modal-entity-name">${a.name}</div>
            <div style="font-size:0.6rem;color:var(--gold);margin:0.15rem 0;">${aAuthor || 'Unknown'}</div>
            <div class="modal-entity-theme">${a.theme || ''}</div>
            <div class="modal-entity-score">${a.score || '—'}</div>
          </div>
          <div class="modal-entity ${m.winner === b?.name ? 'winner' : ''}">
            <div class="modal-entity-name">${b?.name || 'BYE'}</div>
            <div style="font-size:0.6rem;color:var(--gold);margin:0.15rem 0;">${bAuthor || 'Unknown'}</div>
            <div class="modal-entity-theme">${b?.theme || ''}</div>
            <div class="modal-entity-score">${b?.score || '—'}</div>
          </div>
        </div>
        ${a.sourceChapter ? `<p style="font-size:0.65rem;color:var(--dim);">Sources: ${a.sourceChapter} | ${b?.sourceChapter || 'N/A'}</p>` : ''}
        ${!m.winner && roundNum > 1 ? `
          <button class="action-btn" onclick="alert('Use narrative-forge.poml to generate battle')">
            Generate Narrative
          </button>
        ` : ''}
      `;

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').onclick = e => {
            if (e.target.id === 'modal') closeModal();
        };
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        init();
    </script>
</body>

</html>
